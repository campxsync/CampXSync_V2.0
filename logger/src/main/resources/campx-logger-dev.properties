# ==============================================================================
# CampXSync Logger Configuration (Development Profile)
# ==============================================================================

campx.logger.level=DEBUG

campx.logger.console.enabled=true
campx.logger.console.color=true

campx.logger.file.enabled=true
campx.logger.file.path=logs/campx-dev-app.log
campx.logger.file.maxSizeMb=5
campx.logger.file.maxBackups=5

campx.logger.json.enabled=true
campx.logger.json.path=logs/campx-dev-flow.jsonl

campx.logger.async.enabled=true
campx.logger.async.capacity=5000

campx.logger.security.mask=true

campx.logger.server.enabled=true
campx.logger.server.port=9898
