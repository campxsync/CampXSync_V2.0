# ==============================================================================
# CampXSync Enterprise Logger Configuration (Production Default)
# ==============================================================================

# Global root log level (TRACE, DEBUG, INFO, WARN, ERROR, FATAL, AUDIT)
campx.logger.level=INFO

# Console Output Configuration
campx.logger.console.enabled=true
campx.logger.console.color=true

# Human-Readable Application Log File
campx.logger.file.enabled=true
campx.logger.file.path=logs/campx-app.log
campx.logger.file.maxSizeMb=10
campx.logger.file.maxBackups=10

# Structured JSON Lines Log File for Code Flow & Latency Analysis
campx.logger.json.enabled=true
campx.logger.json.path=logs/campx-flow.jsonl

# Asynchronous Queue Worker Configuration
campx.logger.async.enabled=true
campx.logger.async.capacity=10000

# Security Masking (Masks passwords, bearer tokens, Aadhaar, cards)
campx.logger.security.mask=true

# Embedded HTTP REST Management & Ingestion Server
campx.logger.server.enabled=true
campx.logger.server.port=9898
