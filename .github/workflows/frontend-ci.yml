name: Frontend CI

on:
  pull_request:
  push:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run build

      - name: Non-database checks
        working-directory: ${{ github.workspace }}
        run: |
          node --experimental-strip-types --test frontend/src/lib/db-role.test.ts frontend/src/lib/db-ssl.test.ts
          node --experimental-strip-types scripts/verify_test_session_gate.mjs
